name: Build CV and Generate PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: 'latest'

    - name: Build Hugo site
      run: hugo --minify

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install

    - name: Start Hugo server in background
      run: |
        hugo server --bind 0.0.0.0 --baseURL http://localhost:1313/ &
        for i in {1..30}; do
          if curl -s http://localhost:1313/cv/ > /dev/null; then
            echo "Hugo is ready"
            break
          fi
          echo "Waiting for Hugo..."
          sleep 2
        done

    - name: Generate PDF
      run: npm run pdf

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: cv-pdf
        path: static/pdf/cv.pdf
